# DAILY REBALANCE (paper trading only)
#
# GitHub's schedule uses UTC and ignores daylight saving time, so we run at
# BOTH 14:00 and 15:00 UTC every weekday. The Python script itself decides
# whether to act:
#   - only on trading days (market holidays are skipped)
#   - only 25+ minutes after the 9:30am ET open (14:00 UTC = 10:00 EDT in
#     summer; 15:00 UTC = 10:00 EST in winter)
#   - only once per day (the second run sees it's already done and exits)
# To go back to weekly, set REBALANCE_FREQUENCY = "weekly" in bot/config.py.
name: Rebalance

on:
  schedule:
    - cron: "0 14,15 * * 1-5"
  workflow_dispatch:          # lets you press "Run workflow" on your phone
    inputs:
      force:
        description: "Trade outside the normal ~10am window (market must be open; still once per day)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit trades.csv etc. back to the repo

concurrency:
  group: bot-repo-writes      # never run two bot jobs at the same time
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the LATEST version of the branch (not the version from when
      # this run was queued), so the bot always reads the newest trades.csv.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rebalance (PAPER account only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m bot.rebalance --force
          else
            python -m bot.rebalance
          fi

      - name: Commit results back to the repo
        if: always()          # save the log even if something went wrong
        run: bash .github/scripts/commit_results.sh "Rebalance"
