# WEEKLY REBALANCE (paper trading only)
#
# GitHub's schedule uses UTC and ignores daylight saving time, so we run at
# BOTH 14:00 and 15:00 UTC on Monday and Tuesday. The Python script itself
# decides whether to act:
#   - only on the first trading day of the week (Monday, or Tuesday if
#     Monday is a market holiday)
#   - only 25+ minutes after the 9:30am ET open (14:00 UTC = 10:00 EDT in
#     summer; 15:00 UTC = 10:00 EST in winter)
#   - only once per day (the second run sees it's already done and exits)
name: Weekly rebalance

on:
  schedule:
    - cron: "0 14,15 * * 1,2"
  workflow_dispatch:          # lets you press "Run workflow" on your phone
    inputs:
      force:
        description: "Trade even if it's not the first trading day of the week (market must be open)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit trades.csv etc. back to the repo

concurrency:
  group: bot-repo-writes      # never run two bot jobs at the same time
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly rebalance (PAPER account only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m bot.rebalance --force
          else
            python -m bot.rebalance
          fi

      - name: Commit results back to the repo
        if: always()          # save the log even if something went wrong
        run: bash .github/scripts/commit_results.sh "Weekly rebalance"
